name: Actualizar propiedades

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow "rembg[cpu]"
      - name: Leer captaciones y cierres de SkyOne Home
        run: python scripts/actualizar.py
      - name: Guardar memoria y fotos nuevas
        run: |
          git config user.name "skyonehome-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache.json fotos
          git diff --cached --quiet || (git commit -m "Actualizar memoria de propiedades" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deploy
        uses: actions/deploy-pages@v4
